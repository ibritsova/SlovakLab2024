  <!-- Landing URL for ads (e.g. Google Ads sitelinks): forwards to the promo section on the
       home page, keeping ?utm_…/gclid/fbclid so the visit is still attributed to the ad.

      var ended = Date.now() >= Date.parse('2026-12-01T00:00:00+01:00');
      location.replace('/' + location.search + (ended ? '#prices' : '#black-friday'));
    })();
  </script>
